name: Deploy Classifier

on:
  push:
    branches: [develop]
    paths:
      - 'services/classifier-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/81558962919/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-classifier@acoustica-495217.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          PROJECT_ID=${{ vars.GCP_PROJECT_ID }} AR_REPO=${{ vars.AR_REPO }} IMAGE_TAG=${{ vars.IMAGE_TAG }} \
          bash services/classifier-service/deploy.sh
