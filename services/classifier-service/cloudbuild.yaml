steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: [auth, configure-docker, europe-central2-docker.pkg.dev]

  - name: gcr.io/cloud-builders/docker
    dir: services/classifier-service
    args:
      - build
      - --platform=linux/amd64
      - -t
      - europe-central2-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/music-genres-classification:$COMMIT_SHA
      - -t
      - europe-central2-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/music-genres-classification:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - europe-central2-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/music-genres-classification

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - music-genres-classification
      - --image=europe-central2-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/music-genres-classification:$COMMIT_SHA
      - --region=$_REGION
      - --project=$PROJECT_ID
      - --port=8080
      - --memory=8Gi
      - --cpu=2
      - --timeout=300
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=SONGS_COLLECTION=audio_metadata_dev,SCORES_COLLECTION=audio_genre_scores_dev
      - --no-allow-unauthenticated

images:
  - europe-central2-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/music-genres-classification:$COMMIT_SHA
  - europe-central2-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/music-genres-classification:latest

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: GCS_ONLY
